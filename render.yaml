services:
  - type: web
    name: netsage-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # You will set this manually in Render dashboard
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
    plan: free

